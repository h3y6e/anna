version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - funcorder
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US
    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: exported
          disabled: false

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

version: 2
builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
archives:
  - files:
      - README.md
      - LICENSE
      - schema/config.schema.json
      - skills/**/*
    format_overrides:
      - goos: windows
        formats:
          - zip
changelog:
  use: github-native
release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
